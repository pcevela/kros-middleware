name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: ruff check src tests
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: podman build --format docker --build-arg "VERSION=${VERSION}" -t kros-middleware:ci -f Containerfile .
      - name: Smoke test
        run: |
          podman run -d --name km --read-only --tmpfs /tmp --cap-drop ALL -p 127.0.0.1:8080:8080 \
            -e KM_UPSTREAM_TOKEN=ci-token-0123456789abcdefghijklmnopqrstuvwxyz \
            -e KM_PUBLIC_BASE_URL=https://ci.example \
            -e KM_WEBHOOK_SECRET=ci-webhook-secret-0123456789abcdefghijkl \
            -e KM_CLIENT_TOKENS=ci:ci-client-token-0123456789abcdefghijklmn \
            -e KM_APPROVER_CREDENTIALS=ci:ci-approver-password-0123456789abcdef \
            kros-middleware:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/invoices)" = 401
          podman logs km

  publish:
    # Only release tags push images; this is the only job with write access to packages.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and push to GHCR
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${REPO,,}"
          podman build --format docker --build-arg "VERSION=${VERSION}" -t "${image}:${VERSION}" -f Containerfile .
          printf '%s' "${TOKEN}" | podman login ghcr.io -u "${ACTOR}" --password-stdin
          podman push "${image}:${VERSION}"
          # Move "latest" only for plain release tags like v1.2.3 (not pre-releases).
          if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            podman tag "${image}:${VERSION}" "${image}:latest"
            podman push "${image}:latest"
          fi
