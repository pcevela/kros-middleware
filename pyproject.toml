[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kros-middleware"
dynamic = ["version"]
description = "Restricting proxy and webhook receiver for the KROS OpenAPI with human send approval"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Patrik Cevela" }]
keywords = ["kros", "invoicing", "efaktura", "peppol", "webhook", "proxy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "starlette>=0.37,<2",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
kros-middleware = "kros_middleware.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "kros_middleware.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kros_middleware = ["templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "S", "UP", "I"]
ignore = ["S101", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
