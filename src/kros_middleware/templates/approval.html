<!DOCTYPE html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>$page_title</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:46rem;margin:1.5rem auto;padding:0 1rem;color:#1b1b1b;background:#fafafa}
h1{font-size:1.3rem}table{border-collapse:collapse;width:100%;margin:1rem 0}
th,td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid #ddd;vertical-align:top}th{width:34%;color:#555;font-weight:600}
.warn{background:#fde8e8;border:1px solid #e0a0a0;padding:.6rem .8rem;border-radius:.4rem;margin:.8rem 0}
.state{background:#eef3fb;border:1px solid #b9cbe8;padding:.6rem .8rem;border-radius:.4rem;margin:.8rem 0}
.key{font-family:ui-monospace,Menlo,monospace;font-size:1.05rem;font-weight:700}
form{display:inline-block;margin:.5rem .5rem 0 0}
button{font-size:1rem;padding:.6rem 1.2rem;border-radius:.4rem;border:1px solid #888;cursor:pointer}
.approve{background:#1f7a3a;color:#fff;border-color:#1f7a3a}.reject{background:#fff;color:#a12020;border-color:#a12020}
small{color:#666}
</style>
</head>
<body>
<h1>$page_title</h1>
$state_block
$warnings
<table>
$rows
</table>
$items_block
$actions
<p><small>$footer</small></p>
</body>
</html>
