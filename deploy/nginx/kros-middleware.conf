# Example nginx site for kros-middleware. Replace kros.example.com and the
# certificate paths; nginx handles TLS and certificates (e.g. certbot).

limit_req_zone $binary_remote_addr zone=km_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=km_hook:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=km_approve:10m rate=1r/s;

# Log the path without the query string so approval tokens never reach the logs.
log_format km_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri" '
                      '$status $body_bytes_sent "$http_user_agent"';

upstream kros_middleware {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name kros.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kros.example.com;

    ssl_certificate     /etc/letsencrypt/live/kros.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kros.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/kros-middleware.access.log km_noquery;

    # Pass paths through untouched so nginx and the middleware see the same path.
    merge_slashes off;
    server_tokens off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # KROS webhooks (KM_WEBHOOK_PATH).
    location = /webhooks/kros {
        limit_except POST { deny all; }
        limit_req zone=km_hook burst=20 nodelay;
        client_max_body_size 1m;
        proxy_pass http://kros_middleware;
    }

    # Approval pages for humans. Optionally restrict further, e.g. to your VPN:
    #   allow 10.0.0.0/8; deny all;
    location /approvals/ {
        # nginx error-log lines include the request line with the one-time token; keep them out.
        error_log /var/log/nginx/kros-middleware.approvals.error.log crit;
        limit_req zone=km_approve burst=10 nodelay;
        client_max_body_size 8k;
        proxy_pass http://kros_middleware;
    }

    # Proxy and results API for clients.
    location /api/ {
        limit_req zone=km_api burst=20 nodelay;
        client_max_body_size 1m;   # keep in line with KM_MAX_BODY_BYTES
        proxy_pass http://kros_middleware;
    }
    location /results/ {
        limit_req zone=km_api burst=20 nodelay;
        client_max_body_size 1k;
        proxy_pass http://kros_middleware;
    }

    location = /healthz { proxy_pass http://kros_middleware; }
    location / { return 404; }
}
